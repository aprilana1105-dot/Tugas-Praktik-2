<div class="dashboard-content">
    <h1 id="greetText"></h1>
</div>

<script>
let hour = new Date().getHours();
let greet = hour < 12 ? "Selamat Pagi"
          : hour < 15 ? "Selamat Siang"
          : hour < 18 ? "Selamat Sore"
          : "Selamat Malam";
document.getElementById("greetText").innerHTML = greet;
</script>
